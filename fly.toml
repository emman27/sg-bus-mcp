# fly.toml app configuration file generated for sg-bus-mcp on 2026-09-25T04:09:52Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'sg-bus-mcp'
primary_region = 'sin'

[build]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  checks = [{ grace_period = '10s', interval = '30s', method = 'GET', path = '/', timeout = '5s' }]

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256
